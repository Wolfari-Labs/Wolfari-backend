message CreateClosureResponse { oneof result { ClosureView closure = 1; wolfari.common.v1.Operation operation = 2; } }
message ConfirmClosureResponse { oneof result { ClosureView closure = 1; wolfari.common.v1.Operation operation = 2; } }
message CancelClosureResponse { oneof result { ClosureView closure = 1; wolfari.common.v1.Operation operation = 2; } }
message RemindClosureResponse { oneof result { ClosureView closure = 1; wolfari.common.v1.Operation operation = 2; } }

