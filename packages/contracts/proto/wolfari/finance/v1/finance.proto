syntax = "proto3";
package wolfari.finance.v1;
import "google/protobuf/timestamp.proto";
import "wolfari/common/v1/types.proto";

service FinanceService {
  rpc UploadFinanceReceipt(UploadFinanceReceiptRequest) returns (UploadFinanceReceiptResponse);
  rpc DownloadFinanceReceipt(DownloadFinanceReceiptRequest) returns (DownloadFinanceReceiptResponse);
  rpc UpdateContributionRequest(UpdateContributionRequestRequest) returns (UpdateContributionRequestResponse);
  rpc UpdateContributionAmount(UpdateContributionAmountRequest) returns (UpdateContributionAmountResponse);
  rpc WaiveContribution(WaiveContributionRequest) returns (WaiveContributionResponse);
  rpc CancelContribution(CancelContributionRequest) returns (CancelContributionResponse);
  rpc ListContributionRequests(ListContributionRequestsRequest) returns (ListContributionRequestsResponse);
  rpc ListContributions(ListContributionsRequest) returns (ListContributionsResponse);
  rpc CreateContributionRequest(CreateContributionRequestRequest) returns (CreateContributionRequestResponse);
  rpc UpdateFundBudget(UpdateFundBudgetRequest) returns (UpdateFundBudgetResponse);
  rpc CreatePaymentDestination(CreatePaymentDestinationRequest) returns (CreatePaymentDestinationResponse);
  rpc UpdatePaymentDestination(UpdatePaymentDestinationRequest) returns (UpdatePaymentDestinationResponse);
  rpc EnableFund(EnableFundRequest) returns (EnableFundResponse);
  rpc ConfirmPaymentDestination(ConfirmPaymentDestinationRequest) returns (ConfirmPaymentDestinationResponse);
  rpc GetFund(GetFundRequest) returns (GetFundResponse);
  rpc ListPaymentDestinations(ListPaymentDestinationsRequest) returns (ListPaymentDestinationsResponse);
  rpc ExecuteTripOperation(ExecuteTripOperationRequest) returns (ExecuteTripOperationResponse);
  rpc GetOperationResult(GetOperationResultRequest) returns (GetOperationResultResponse);
  rpc CancelOperationIfNotCommitted(CancelOperationIfNotCommittedRequest) returns (CancelOperationIfNotCommittedResponse);
  rpc GetExportSnapshot(GetExportSnapshotRequest) returns (GetExportSnapshotResponse);
  rpc GetAutomationContext(GetAutomationContextRequest) returns (GetAutomationContextResponse);
}

message ContributionAllocationInput {
  string member_user_id = 1;
  string amount = 2;
  string destination_id = 3;
}
message CreateContributionRequestRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string fund_id = 3;
  string title = 4;
  repeated ContributionAllocationInput contributions = 5;
  optional string due_at = 6;
  optional string note = 7;
  int32 expected_finance_version = 8;
}
message ContributionRequestView {
  string id = 1;
  string fund_id = 2;
  string title = 3;
  string status = 4;
  int32 version = 5;
  string created_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp due_at = 8;
  optional string note = 9;
  optional string amount_per_member = 10;
  google.protobuf.Timestamp closed_at = 11;
  repeated ContributionView contributions = 12;
  optional int32 finance_version = 13; // Absent only in legacy create receipts.
}
message ContributionView {
  string id = 1;
  string request_id = 2;
  string fund_id = 3;
  string member_user_id = 4;
  string amount = 5;
  string status = 6;
  bool self_contribution = 7;
  google.protobuf.Timestamp member_reported_at = 8;
  google.protobuf.Timestamp confirmed_at = 9;
  optional string confirmed_by_user_id = 10;
  optional string waived_reason = 11;
  optional string cancelled_reason = 12;
  int32 version = 13;
  int32 finance_version = 14;
}
message ListContributionRequestsRequest {
  string actor_user_id = 1;
  string fund_id = 2;
  optional int32 limit = 3;
  optional string cursor = 4;
}
message ListContributionsRequest {
  string actor_user_id = 1;
  string fund_id = 2;
  optional int32 limit = 3;
  optional string cursor = 4;
  optional string status = 5;
  optional string member_user_id = 6;
}
message ListContributionRequestsResponse {
  repeated ContributionRequestView items = 1;
  optional string next_cursor = 2;
}
message ListContributionsResponse {
  repeated ContributionView items = 1;
  optional string next_cursor = 2;
}
message CreateContributionRequestResponse {
  oneof result {
    ContributionRequestView contribution_request = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}

// Configuration only; confirmation is always a separate Holder command.
message DestinationWrite {
  string destination_type = 1;
  optional bool is_default = 2;
  optional bool active = 3;
  optional string bank_code = 4;
  optional string account_number = 5;
  optional string account_name = 6;
  optional string momo_phone = 7;
}
message BudgetChange {
  oneof change {
    string value = 1;
    bool clear = 2;
  }
}
message DestinationPatch {
  optional string destination_type = 1;
  optional bool is_default = 2;
  optional bool active = 3;
  optional string bank_code = 4;
  optional string account_number = 5;
  optional string account_name = 6;
  optional string momo_phone = 7;
}
message UpdateFundBudgetRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string fund_id = 3;
  BudgetChange budget = 4;
  int32 expected_finance_version = 5;
}
message CreatePaymentDestinationRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string fund_id = 3;
  DestinationWrite destination = 4;
  int32 expected_finance_version = 5;
}
message UpdatePaymentDestinationRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string fund_id = 3;
  string destination_id = 4;
  DestinationPatch patch = 5;
  int32 expected_version = 6;
  int32 expected_finance_version = 7;
}
message UpdateFundBudgetResponse {
  oneof result {
    FundView fund = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}
message CreatePaymentDestinationResponse {
  oneof result {
    PaymentDestinationView destination = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}
message UpdatePaymentDestinationResponse {
  oneof result {
    PaymentDestinationView destination = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}
message EnableFundRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string trip_id = 3;
  string holder_user_id = 4;
  string currency = 5;
  optional string budget_amount = 6;
  DestinationWrite destination = 7;
}
message ConfirmPaymentDestinationRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string fund_id = 3;
  string destination_id = 4;
  int32 expected_version = 5;
  int32 expected_finance_version = 6;
}
message EnableFundResponse {
  oneof result {
    FundView fund = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}
message ConfirmPaymentDestinationResponse {
  oneof result {
    PaymentDestinationView destination = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}
// API071/073 read projections. Existing export Fund wire semantics stay unchanged.
message GetFundRequest {
  string trip_id = 1;
  string actor_user_id = 2;
}
message GetFundResponse { FundView fund = 1; }
message FundView {
  string id = 1;
  string trip_id = 2;
  string holder_user_id = 3;
  string currency = 4;
  optional string budget_amount = 5;
  string current_balance = 6;
  string reserved_refund = 7;
  string available_balance = 8;
  FundStatus status = 9;
  int32 finance_version = 10;
  google.protobuf.Timestamp closed_at = 11;
}
message ListPaymentDestinationsRequest {
  string fund_id = 1;
  string actor_user_id = 2;
}
message ListPaymentDestinationsResponse { repeated PaymentDestinationView destinations = 1; }
enum PaymentDestinationType {
  PAYMENT_DESTINATION_TYPE_UNSPECIFIED = 0;
  PAYMENT_DESTINATION_TYPE_VIETQR = 1;
  PAYMENT_DESTINATION_TYPE_MOMO_SANDBOX = 2;
}
message PaymentDestinationView {
  string id = 1;
  string fund_id = 2;
  PaymentDestinationType destination_type = 3;
  bool is_default = 4;
  bool active = 5;
  int32 version = 6;
  google.protobuf.Timestamp confirmed_by_holder_at = 7;
  // Omitted for ordinary members; never filled from client-supplied roles.
  optional string bank_code = 8;
  optional string account_number = 9;
  optional string account_name = 10;
  optional string momo_phone = 11;
}
message ExecuteTripOperationRequest {
  string operation_id = 1;
  string request_hash = 2;
  string operation_type = 3;
  wolfari.common.v1.AuthorizationContext authorization_context = 4;
  MembershipLifecycleTarget membership_target = 5;
}
// Required for LEAVE_MEMBER/REMOVE_MEMBER. Cancellation binds the identical intent.
message MembershipLifecycleTarget {
  string membership_id = 1;
  string user_id = 2;
  string reason = 3;
}
message ExecuteTripOperationResponse { wolfari.common.v1.Receipt receipt = 1; }
message GetOperationResultRequest { string operation_id = 1; }
message GetOperationResultResponse {
  oneof result {
    wolfari.common.v1.NotFound not_found = 1;
    wolfari.common.v1.Receipt receipt = 2;
  }
}
message CancelOperationIfNotCommittedRequest {
  string operation_id = 1;
  string request_hash = 2;
  string command_scope = 3;
  wolfari.common.v1.AuthorizationContext authorization_context = 4;
  MembershipLifecycleTarget membership_target = 5;
}
message CancelOperationIfNotCommittedResponse { wolfari.common.v1.Receipt receipt = 1; }
message GetExportSnapshotRequest {
  string trip_id = 1;
  string authorized_user_id = 2;
  wolfari.common.v1.ExportScope scope = 3;
}
message GetExportSnapshotResponse {
  FinanceSnapshot snapshot = 1;
  int32 finance_version = 2;
  google.protobuf.Timestamp captured_at = 3;
}
message GetAutomationContextRequest {
  string fund_id = 1;
  string source_type = 2;
  string source_id = 3;
}
message GetAutomationContextResponse {
  int32 finance_version = 1;
  FundStatus status = 2;
  repeated wolfari.common.v1.Recipient authorized_recipients = 3;
  google.protobuf.Timestamp due_at = 4;
}
enum FundStatus {
  FUND_STATUS_UNSPECIFIED = 0;
  FUND_STATUS_OPEN = 1;
  FUND_STATUS_CLOSING = 2;
  FUND_STATUS_CLOSED = 3;
}
enum ContributionStatus {
  CONTRIBUTION_STATUS_UNSPECIFIED = 0;
  CONTRIBUTION_STATUS_PENDING = 1;
  CONTRIBUTION_STATUS_TRANSFER_REPORTED = 2;
  CONTRIBUTION_STATUS_CONFIRMED = 3;
  CONTRIBUTION_STATUS_WAIVED = 4;
  CONTRIBUTION_STATUS_CANCELLED = 5;
}
enum LedgerDirection {
  LEDGER_DIRECTION_UNSPECIFIED = 0;
  LEDGER_DIRECTION_IN = 1;
  LEDGER_DIRECTION_OUT = 2;
}
message Fund {
  string id = 1;
  string trip_id = 2;
  string holder_user_id = 3;
  string currency = 4;
  string budget_amount = 5;
  string current_balance = 6;
  string reserved_refund = 7;
  string available_balance = 8;
  FundStatus status = 9;
  int32 finance_version = 10;
}
message Contribution {
  string id = 1;
  string request_id = 2;
  string member_user_id = 3;
  string amount = 4;
  ContributionStatus status = 5;
  bool self_contribution = 6;
  int32 version = 7;
}
message Expense {
  string id = 1;
  string title = 2;
  optional string description = 3;
  string amount = 4;
  string status = 5;
  optional string category = 6;
  google.protobuf.Timestamp paid_at = 7;
  int32 version = 8;
}
message FinancialNote {
  string id = 1;
  string description = 2;
  optional string amount = 3;
  optional string payer_user_id = 4;
  int32 version = 5;
}
message Refund {
  string id = 1;
  string member_user_id = 2;
  string amount = 3;
  string status = 4;
  optional string reason = 5;
  int32 version = 6;
}
message LedgerEntry {
  string id = 1;
  int64 sequence = 2;
  LedgerDirection direction = 3;
  string transaction_type = 4;
  string amount = 5;
  string balance_after = 6;
  optional string contribution_id = 7;
  optional string expense_id = 8;
  optional string refund_id = 9;
  optional string reversal_of_id = 10;
  optional string actor_user_id = 11;
  optional string reason = 12;
  google.protobuf.Timestamp created_at = 13;
}
message FinanceSnapshot {
  Fund fund = 1;
  repeated Contribution contributions = 2;
  repeated Expense expenses = 3;
  repeated FinancialNote notes = 4;
  repeated Refund refunds = 5;
  repeated LedgerEntry ledger = 6;
  string environment = 7; // TEST/SANDBOX only for this MVP.
}

message UpdateContributionRequestRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string fund_id = 3;
  string request_id = 4;
  optional string title = 5;
  optional string due_at = 6;
  optional string note = 7;
  int32 expected_version = 8;
  int32 expected_finance_version = 9;
}
message UpdateContributionAmountRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string contribution_id = 3;
  string amount = 4;
  int32 expected_version = 5;
  int32 expected_finance_version = 6;
}
message WaiveContributionRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string contribution_id = 3;
  string reason = 4;
  int32 expected_version = 5;
  int32 expected_finance_version = 6;
}
message CancelContributionRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string contribution_id = 3;
  string reason = 4;
  int32 expected_version = 5;
  int32 expected_finance_version = 6;
}
message UpdateContributionAmountResponse {
  oneof result {
    ContributionView contribution = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}

message UpdateContributionRequestResponse {
  oneof result {
    ContributionRequestView contribution_request = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}

message WaiveContributionResponse {
  oneof result {
    ContributionView contribution = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}

message CancelContributionResponse {
  oneof result {
    ContributionView contribution = 1;
    wolfari.common.v1.Operation operation = 2;
  }
}

message UploadFinanceReceiptRequest {
  string actor_user_id = 1;
  string fund_id = 2;
  string mime_type = 3;
  bytes content = 4;
}
message UploadFinanceReceiptResponse {
  string object_key = 1;
  string mime_type = 2;
  int32 size_bytes = 3;
}
message DownloadFinanceReceiptRequest {
  string actor_user_id = 1;
  string fund_id = 2;
  string object_key = 3;
}
message DownloadFinanceReceiptResponse {
  string object_key = 1;
  string mime_type = 2;
  int32 size_bytes = 3;
  bytes content = 4;
}
