syntax = "proto3";
package wolfari.trip.v1;
import "google/protobuf/timestamp.proto";
import "wolfari/common/v1/types.proto";

service TripService {
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse);
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
  rpc UpdateTrip(UpdateTripRequest) returns (UpdateTripResponse);
  rpc GetAccessContext(GetAccessContextRequest) returns (GetAccessContextResponse);
  rpc UpdatePlanPolicy(UpdatePlanPolicyRequest) returns (UpdatePlanPolicyResponse);
  rpc BeginFinanceOperation(BeginFinanceOperationRequest) returns (BeginFinanceOperationResponse);
  rpc CompleteOperation(CompleteOperationRequest) returns (CompleteOperationResponse);
  rpc GetOperationResult(GetOperationResultRequest) returns (GetOperationResultResponse);
  rpc GetAutomationContext(GetAutomationContextRequest) returns (GetAutomationContextResponse);
  rpc GetInvitationDelivery(GetInvitationDeliveryRequest) returns (GetInvitationDeliveryResponse);
  rpc GetExportWorkerContext(GetExportWorkerContextRequest) returns (GetExportWorkerContextResponse);
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc CreateActivity(CreateActivityRequest) returns (CreateActivityResponse);
  rpc UpdateActivity(UpdateActivityRequest) returns (UpdateActivityResponse);
  rpc DeleteActivity(DeleteActivityRequest) returns (DeleteActivityResponse);
  rpc ReorderActivities(ReorderActivitiesRequest) returns (ReorderActivitiesResponse);
  rpc SetActivityCompletion(SetActivityCompletionRequest) returns (SetActivityCompletionResponse);
}

enum TripLifecycle {
  TRIP_LIFECYCLE_UNSPECIFIED = 0;
  TRIP_LIFECYCLE_UPCOMING = 1;
  TRIP_LIFECYCLE_ONGOING = 2;
  TRIP_LIFECYCLE_COMPLETED = 3;
  TRIP_LIFECYCLE_ARCHIVED = 4;
}

// A message field supplies outer presence; the oneof preserves set-versus-clear.
message StringPatch {
  oneof change {
    string value = 1;
    bool clear = 2;
  }
}

message TripPermissions {
  bool can_read = 1;
  bool can_update = 2;
}

// Public application projection. Internal receipt and audit data are excluded.
message Trip {
  string id = 1;
  string name = 2;
  optional string description = 3;
  google.protobuf.Timestamp start_at = 4;
  google.protobuf.Timestamp end_at = 5;
  string timezone = 6;
  TripLifecycle lifecycle = 7;
  google.protobuf.Timestamp archived_at = 8;
  optional string public_description = 9;
  wolfari.common.v1.PlanPolicy plan_edit_policy = 10;
  int32 plan_version = 11;
  int32 membership_revision = 12;
  int32 export_revision = 13;
  wolfari.common.v1.Membership current_membership = 14;
  TripPermissions permissions = 15;
}

message CreateTripRequest {
  string operation_id = 1; // The HTTP client_request_id/idempotency key.
  string actor_user_id = 2;
  string name = 3;
  google.protobuf.Timestamp start_at = 4;
  google.protobuf.Timestamp end_at = 5;
  optional string timezone = 6;
  optional string description = 7;
}
message CreateTripResponse { Trip trip = 1; }

message ListTripsRequest {
  string actor_user_id = 1;
  int32 limit = 2;
  optional string cursor = 3;
  optional TripLifecycle lifecycle = 4;
}
message ListTripsResponse {
  repeated Trip items = 1;
  optional string next_cursor = 2;
}

message GetTripRequest {
  string actor_user_id = 1;
  string trip_id = 2;
}
message GetTripResponse { Trip trip = 1; }

message UpdateTripRequest {
  string operation_id = 1; // The HTTP Idempotency-Key.
  string actor_user_id = 2;
  string trip_id = 3;
  int32 expected_export_revision = 4;
  int32 expected_plan_version = 5;
  optional string name = 6;
  StringPatch description = 7;
  StringPatch public_description = 8;
}
message UpdateTripResponse { Trip trip = 1; }

message GetAccessContextRequest {
  string trip_id = 1;
  string user_id = 2;
  string action = 3;
}
message GetAccessContextResponse { wolfari.common.v1.AccessContext context = 1; }

message PlanPolicySettings {
  wolfari.common.v1.PlanPolicy policy = 1;
  repeated string editor_member_ids = 2;
  int32 membership_revision = 3;
}

message UpdatePlanPolicyRequest {
  string operation_id = 1;
  string actor_user_id = 2;
  string trip_id = 3;
  wolfari.common.v1.PlanPolicy policy = 4;
  repeated string editor_member_ids = 5;
  int32 expected_membership_revision = 6;
}

message UpdatePlanPolicyResponse { PlanPolicySettings plan_policy = 1; }

message BeginFinanceOperationRequest {
  string operation_id = 1;
  string trip_id = 2;
  wolfari.common.v1.Actor actor = 3;
  string command = 4;
  string request_hash = 5;
  optional int32 expected_context_revision = 6;
}
message BeginFinanceOperationResponse {
  wolfari.common.v1.AuthorizationContext context = 1;
  repeated string active_user_ids = 2;
  optional string closure_lock_id = 3;
}
message CompleteOperationRequest {
  string operation_id = 1;
  wolfari.common.v1.OperationOutcome finance_outcome = 2;
  wolfari.common.v1.ClosureEffect closure_effect = 3;
  // Added by the write-request convention in section 6.
  string request_hash = 4;
  wolfari.common.v1.Actor actor = 5;
}
message CompleteOperationResponse { wolfari.common.v1.Operation operation = 1; }
message GetOperationResultRequest { string operation_id = 1; }
message GetOperationResultResponse { wolfari.common.v1.Operation operation = 1; }
message GetAutomationContextRequest {
  string trip_id = 1;
  string source_type = 2;
  string source_id = 3;
  optional string user_id = 4;
}
message GetAutomationContextResponse { wolfari.common.v1.SourceContext context = 1; }
message GetInvitationDeliveryRequest { string invitation_id = 1; }
message InvitationDelivery {
  string recipient_email = 1;
  string link = 2; // Sensitive RPC-only data.
  google.protobuf.Timestamp expires_at = 3;
}
message GetInvitationDeliveryResponse {
  bool valid = 1;
  InvitationDelivery delivery = 2;
}
message GetExportWorkerContextRequest {
  string job_id = 1;
  string attempt_id = 2;
}
message GetExportWorkerContextResponse {
  string snapshot_key = 1;
  string snapshot_hash = 2;
  int32 snapshot_schema_version = 3;
  wolfari.common.v1.ExportFormat format = 4;
  wolfari.common.v1.ExportTemplate template = 5;
  string result_key = 6;
}

// Typed Plan projection used by Travel; not a live database entity.
enum ActivityStatus {
  ACTIVITY_STATUS_UNSPECIFIED = 0;
  ACTIVITY_STATUS_TODO = 1;
  ACTIVITY_STATUS_COMPLETED = 2;
}
enum EntitySource {
  ENTITY_SOURCE_UNSPECIFIED = 0;
  ENTITY_SOURCE_MANUAL = 1;
  ENTITY_SOURCE_PROVIDER = 2;
  ENTITY_SOURCE_DSS = 3;
}
enum DressScope {
  DRESS_SCOPE_UNSPECIFIED = 0;
  DRESS_SCOPE_TRIP = 1;
  DRESS_SCOPE_DAY = 2;
  DRESS_SCOPE_ACTIVITY = 3;
}
message Activity {
  string id = 1;
  string title = 2;
  string activity_type = 3;
  optional string description = 4;
  optional string public_description = 5;
  optional string selected_location_id = 6;
  google.protobuf.Timestamp starts_at = 7;
  google.protobuf.Timestamp ends_at = 8;
  int32 position = 9;
  ActivityStatus status = 10;
  EntitySource source = 11;
}
message OpeningPeriod {
  int32 weekday = 1;
  string opens_at = 2;
  string closes_at = 3;
}
message SelectedLocation {
  string id = 1;
  string name = 2;
  optional string address = 3;
  wolfari.common.v1.Coordinate coordinates = 4;
  optional string provider = 5;
  optional string provider_place_id = 6;
  EntitySource source = 7;
  repeated OpeningPeriod opening_hours = 8;
  google.protobuf.Timestamp fetched_at = 9;
}
message DressCode {
  string id = 1;
  DressScope scope_type = 2;
  string label = 3;
  optional string description = 4;
  optional string public_description = 5;
  optional string plan_date = 6;
  optional string activity_id = 7;
  EntitySource source = 8;
}
message PackingItem {
  string id = 1;
  string name = 2;
  string quantity = 3; // Positive exact decimal, not a floating-point amount.
  optional string unit = 4;
  optional string note = 5;
  optional string category = 6;
  optional string assigned_member_id = 7;
  google.protobuf.Timestamp due_at = 8;
  ActivityStatus status = 9;
  EntitySource source = 10;
}
message PlanSnapshot {
  string trip_id = 1;
  int32 plan_version = 2;
  int32 export_revision = 3;
  string timezone = 4;
  google.protobuf.Timestamp start_at = 5;
  google.protobuf.Timestamp end_at = 6;
  repeated Activity activities = 7;
  repeated SelectedLocation selected_locations = 8;
  repeated DressCode dress_codes = 9;
  repeated PackingItem packing_items = 10;
}

message TimestampPatch { oneof change { google.protobuf.Timestamp value = 1; bool clear = 2; } }
message PlanPermissions { bool can_read = 1; bool can_edit = 2; bool can_complete = 3; }

message PlanActivity {
  string id = 1; string trip_id = 2; string title = 3;
  optional string description = 4; optional string public_description = 5;
  string activity_type = 6; optional string selected_location_id = 7;
  google.protobuf.Timestamp starts_at = 8; google.protobuf.Timestamp ends_at = 9;
  int32 position = 10; ActivityStatus status = 11; EntitySource source = 12;
  optional string completed_by_user_id = 13; google.protobuf.Timestamp completed_at = 14;
  string created_by_user_id = 15; int32 plan_version = 16;
}
message PlanLocation {
  string id = 1; string trip_id = 2; string name = 3; optional string address = 4;
  optional string latitude = 5; optional string longitude = 6;   // chuỗi thập phân chính xác
  optional string provider = 7; optional string provider_place_id = 8; EntitySource source = 9;
  optional string opening_hours_json = 10; google.protobuf.Timestamp fetched_at = 11;
  string metadata_json = 12; int32 plan_version = 13;
}
message PlanDressCode {
  string id = 1; string trip_id = 2; DressScope scope_type = 3; optional string plan_date = 4;
  optional string activity_id = 5; string label = 6; optional string description = 7;
  optional string public_description = 8; EntitySource source = 9; int32 plan_version = 10;
}
message PlanPackingItem {
  string id = 1; string trip_id = 2; string name = 3; string quantity = 4; optional string unit = 5;
  optional string note = 6; optional string category = 7; optional string assigned_member_id = 8;
  google.protobuf.Timestamp due_at = 9; ActivityStatus status = 10; EntitySource source = 11;
  optional string completed_by_user_id = 12; google.protobuf.Timestamp completed_at = 13;
  int32 plan_version = 14;
}
message Plan {
  string trip_id = 1; int32 plan_version = 2; int32 export_revision = 3;
  repeated PlanActivity activities = 4; repeated PlanLocation selected_locations = 5;
  repeated PlanDressCode dress_codes = 6; repeated PlanPackingItem packing_items = 7;
  PlanPermissions permissions = 8;
}
message PlanVersion { string trip_id = 1; int32 plan_version = 2; int32 export_revision = 3; }

message GetPlanRequest { string actor_user_id = 1; string trip_id = 2; }
message GetPlanResponse { Plan plan = 1; }

message CreateActivityRequest {
  string operation_id = 1; string actor_user_id = 2; string trip_id = 3;
  int32 expected_plan_version = 4; string title = 5; string activity_type = 6;
  optional string description = 7; optional string public_description = 8;
  optional string selected_location_id = 9;
  google.protobuf.Timestamp starts_at = 10; google.protobuf.Timestamp ends_at = 11;
  int32 position = 12;
}
message CreateActivityResponse { PlanActivity activity = 1; int32 export_revision = 2; }

message UpdateActivityRequest {
  string operation_id = 1; string actor_user_id = 2; string trip_id = 3; string activity_id = 4;
  int32 expected_plan_version = 5;
  optional string title = 6; optional string activity_type = 7;
  StringPatch description = 8; StringPatch public_description = 9;
  StringPatch selected_location_id = 10;
  TimestampPatch starts_at = 11; TimestampPatch ends_at = 12;
  optional int32 position = 13;
}
message UpdateActivityResponse { PlanActivity activity = 1; int32 export_revision = 2; }

message DeleteActivityRequest {
  string operation_id = 1; string actor_user_id = 2; string trip_id = 3; string activity_id = 4;
  int32 expected_plan_version = 5; bool confirmed = 6;
}
message DeleteActivityResponse { PlanVersion version = 1; }

message ReorderActivitiesRequest {
  string operation_id = 1; string actor_user_id = 2; string trip_id = 3;
  int32 expected_plan_version = 4; repeated string activity_ids = 5;
}
message ReorderActivitiesResponse { PlanVersion version = 1; }

message SetActivityCompletionRequest {
  string operation_id = 1; string actor_user_id = 2; string trip_id = 3; string activity_id = 4;
  int32 expected_plan_version = 5; ActivityStatus status = 6;
}
message SetActivityCompletionResponse { PlanActivity activity = 1; int32 export_revision = 2; }
