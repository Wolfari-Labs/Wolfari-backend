syntax = "proto3";
package wolfari.automation.v1;

import "google/protobuf/timestamp.proto";

service AutomationService {
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (GetNotificationPreferencesResponse);
  rpc UpdateNotificationPreferences(UpdateNotificationPreferencesRequest) returns (UpdateNotificationPreferencesResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);
  rpc CreatePriceWatch(CreatePriceWatchRequest) returns (CreatePriceWatchResponse);
  rpc ListPriceWatches(ListPriceWatchesRequest) returns (ListPriceWatchesResponse);
  rpc UpdatePriceWatch(UpdatePriceWatchRequest) returns (UpdatePriceWatchResponse);
  rpc PausePriceWatch(PausePriceWatchRequest) returns (PausePriceWatchResponse);
  rpc ResumePriceWatch(ResumePriceWatchRequest) returns (ResumePriceWatchResponse);
  rpc StopPriceWatch(StopPriceWatchRequest) returns (StopPriceWatchResponse);
  rpc ListPriceObservations(ListPriceObservationsRequest) returns (ListPriceObservationsResponse);
}

enum NotificationGroup {
  NOTIFICATION_GROUP_UNSPECIFIED = 0;
  NOTIFICATION_GROUP_INVITATION = 1;
  NOTIFICATION_GROUP_PLAN = 2;
  NOTIFICATION_GROUP_PACKING = 3;
  NOTIFICATION_GROUP_CONTRIBUTION = 4;
  NOTIFICATION_GROUP_CLOSURE = 5;
  NOTIFICATION_GROUP_PRICE = 6;
}

enum DevicePlatform {
  DEVICE_PLATFORM_UNSPECIFIED = 0;
  DEVICE_PLATFORM_IOS = 1;
  DEVICE_PLATFORM_ANDROID = 2;
  DEVICE_PLATFORM_WEB = 3;
}

enum NotificationStatus {
  NOTIFICATION_STATUS_UNSPECIFIED = 0;
  NOTIFICATION_STATUS_CREATED = 1;
  NOTIFICATION_STATUS_AVAILABLE = 2;
  NOTIFICATION_STATUS_CANCELLED = 3;
}

message NotificationGroupOverride {
  NotificationGroup group = 1;
  optional bool push = 2;
  optional bool email = 3;
}

message NotificationPreferenceView {
  bool push_enabled = 1;
  bool email_enabled = 2;
  repeated NotificationGroupOverride group_overrides = 3;
  int32 version = 4;
}

message DeviceView {
  string id = 1;
  DevicePlatform platform = 2;
  bool active = 3;
  google.protobuf.Timestamp last_seen_at = 4;
}

message NotificationView {
  string id = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  optional string trip_id = 5;
  optional string source_id = 6;
  NotificationStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp read_at = 9;
}

message GetNotificationPreferencesRequest { string actor_user_id = 1; }

message UpdateNotificationPreferencesRequest {
  string actor_user_id = 1;
  optional bool push_enabled = 2;
  optional bool email_enabled = 3;
  repeated NotificationGroupOverride group_overrides = 4;
  int32 expected_version = 5;
}

message RegisterDeviceRequest {
  string actor_user_id = 1;
  DevicePlatform platform = 2;
  string token = 3;
}

message DeleteDeviceRequest {
  string actor_user_id = 1;
  string device_id = 2;
}

message ListNotificationsRequest {
  string actor_user_id = 1;
  int32 limit = 2;
  optional string cursor = 3;
  optional bool unread = 4;
}

message MarkNotificationReadRequest {
  string actor_user_id = 1;
  string notification_id = 2;
}

message GetNotificationPreferencesResponse { NotificationPreferenceView preference = 1; }
message UpdateNotificationPreferencesResponse { NotificationPreferenceView preference = 1; }
message RegisterDeviceResponse { DeviceView device = 1; }
message DeleteDeviceResponse {}
message ListNotificationsResponse {
  repeated NotificationView items = 1;
  optional string next_cursor = 2;
}
message MarkNotificationReadResponse { NotificationView notification = 1; }

enum JourneyType {
  JOURNEY_TYPE_UNSPECIFIED = 0;
  JOURNEY_TYPE_ONE_WAY = 1;
  JOURNEY_TYPE_ROUND_TRIP = 2;
}

enum PriceWatchStatus {
  PRICE_WATCH_STATUS_UNSPECIFIED = 0;
  PRICE_WATCH_STATUS_ACTIVE = 1;
  PRICE_WATCH_STATUS_PAUSED = 2;
  PRICE_WATCH_STATUS_EXPIRED = 3;
  PRICE_WATCH_STATUS_STOPPED = 4;
}

message PassengerMix {
  int32 adults = 1;
  int32 children = 2;
  int32 infants = 3;
}

message StringChange {
  oneof change {
    string value = 1;
    bool clear = 2;
  }
}

message PriceWatchWrite {
  string provider = 1;
  string origin = 2;
  string destination = 3;
  string departure_date = 4;
  optional string return_date = 5;
  JourneyType journey_type = 6;
  PassengerMix passengers = 7;
  optional string cabin_class = 8;
  string currency = 9;
  string threshold_price = 10;
  google.protobuf.Timestamp departure_at = 11;
}

message PriceWatchPatch {
  optional string provider = 1;
  optional string origin = 2;
  optional string destination = 3;
  optional string departure_date = 4;
  StringChange return_date = 5;
  optional JourneyType journey_type = 6;
  PassengerMix passengers = 7;
  StringChange cabin_class = 8;
  optional string currency = 9;
  optional string threshold_price = 10;
  optional google.protobuf.Timestamp departure_at = 11;
}

message PriceQueryView {
  string provider = 1;
  string transport_type = 2;
  string origin = 3;
  string destination = 4;
  string departure_date = 5;
  optional string return_date = 6;
  JourneyType journey_type = 7;
  PassengerMix passengers = 8;
  optional string cabin_class = 9;
  string currency = 10;
  google.protobuf.Timestamp departure_at = 11;
}

message PriceWatchView {
  string id = 1;
  string trip_id = 2;
  string user_id = 3;
  string query_group_id = 4;
  string threshold_price = 5;
  string currency = 6;
  PriceWatchStatus status = 7;
  optional string status_reason = 8;
  int32 version = 9;
  google.protobuf.Timestamp expires_at = 10;
  optional string last_alert_price = 11;
  optional google.protobuf.Timestamp last_alert_at = 12;
  PriceQueryView normalized_query = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message PriceObservationView {
  string id = 1;
  string price = 2;
  string currency = 3;
  string provider = 4;
  google.protobuf.Timestamp observed_at = 5;
  google.protobuf.Timestamp fetched_at = 6;
  string fare_metadata_json = 7;
}

message CreatePriceWatchRequest {
  string actor_user_id = 1;
  string trip_id = 2;
  string client_request_id = 3;
  PriceWatchWrite watch = 4;
}

message ListPriceWatchesRequest {
  string actor_user_id = 1;
  string trip_id = 2;
  int32 limit = 3;
  optional string cursor = 4;
}

message UpdatePriceWatchRequest {
  string actor_user_id = 1;
  string watch_id = 2;
  int32 expected_version = 3;
  PriceWatchPatch patch = 4;
}

message PausePriceWatchRequest {
  string actor_user_id = 1;
  string watch_id = 2;
  int32 expected_version = 3;
}

message ResumePriceWatchRequest {
  string actor_user_id = 1;
  string watch_id = 2;
  int32 expected_version = 3;
}

message StopPriceWatchRequest {
  string actor_user_id = 1;
  string watch_id = 2;
  int32 expected_version = 3;
}

message ListPriceObservationsRequest {
  string actor_user_id = 1;
  string watch_id = 2;
  int32 limit = 3;
  optional string cursor = 4;
}

message CreatePriceWatchResponse { PriceWatchView watch = 1; }
message UpdatePriceWatchResponse { PriceWatchView watch = 1; }
message PausePriceWatchResponse { PriceWatchView watch = 1; }
message ResumePriceWatchResponse { PriceWatchView watch = 1; }
message StopPriceWatchResponse { PriceWatchView watch = 1; }
message ListPriceWatchesResponse {
  repeated PriceWatchView items = 1;
  optional string next_cursor = 2;
}
message ListPriceObservationsResponse {
  repeated PriceObservationView items = 1;
  optional string next_cursor = 2;
}
