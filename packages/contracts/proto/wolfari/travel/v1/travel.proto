syntax = "proto3";
package wolfari.travel.v1;
import "google/protobuf/timestamp.proto";
import "wolfari/common/v1/types.proto";
import "wolfari/trip/v1/trip.proto";

service TravelService {
  rpc SearchPlaces(SearchPlacesRequest) returns (SearchPlacesResponse);
  rpc GetRoute(GetRouteRequest) returns (GetRouteResponse);
  rpc GetWeather(GetWeatherRequest) returns (GetWeatherResponse);
  rpc GetRecommendation(GetRecommendationRequest) returns (GetRecommendationResponse);
  // POI-IMAGES: one stored WebP variant of a licensed POI photo (public, content-addressed).
  rpc GetPoiImage(GetPoiImageRequest) returns (GetPoiImageResponse);
}
enum ProviderStatus {
  PROVIDER_STATUS_UNSPECIFIED = 0;
  PROVIDER_STATUS_SUCCESS = 1;
  PROVIDER_STATUS_NO_RESULT = 2;
  PROVIDER_STATUS_ERROR = 3;
}
enum RouteMode {
  ROUTE_MODE_UNSPECIFIED = 0;
  ROUTE_MODE_WALKING = 1;
  ROUTE_MODE_DRIVING = 2;
  ROUTE_MODE_CYCLING = 3;
}
message ProviderMetadata {
  ProviderStatus status = 1;
  string provider = 2;
  google.protobuf.Timestamp fetched_at = 3;
  bool stale = 4;
  bool is_mock = 5;
  repeated string warnings = 6;
  repeated ProviderAttribution attribution = 7;
  // POI-OVERTURE (Places search only): active POI snapshot and its data release.
  string snapshot_id = 8;
  string data_release = 9;
  bool bbox_truncated = 10; // More POIs in the map frame than `limit`.
}
message ProviderAttribution { string text = 1; string url = 2; }
message Place {
  string id = 1; // External provider ID, not a Wolfari UUID.
  string name = 2;
  string address = 3;
  wolfari.common.v1.Coordinate coordinates = 4;
  repeated wolfari.trip.v1.OpeningPeriod opening_hours = 5;
  string selection_token = 6;
  repeated string categories = 7;
  string attribution = 8;
  // MAP-POI: result source. WOLFARI = curated POI catalogue (id = wolfari_key); otherwise GEOAPIFY.
  string provider = 9;
  string category = 10; // Wolfari taxonomy code; empty for Geoapify results.
  string category_label = 11; // Vietnamese label of category.
  int32 tier = 12; // 1-3 curated golden list, 9 = bulk/external (Geoapify).
  bool coord_verified = 13; // Coordinates checked by a human reviewer.
  optional int32 typical_duration_min = 14;
  string activity_type = 15; // Suggested Plan activity type; may be empty.
  string dress_code_hint = 16;
  // POI-OVERTURE (additive): provenance and province; empty/absent when unknown.
  string source_dataset = 17; // golden | overture | geoapify
  string category_group = 18; // Public search group of `category`.
  string province_code = 19; // Province code after the 2025 merger (34 units).
  string province_name = 20; // Vietnamese province name.
  optional double confidence = 21; // Provider confidence; absent for golden and Geoapify.
  string data_release = 22; // Provider data release, e.g. Overture 2026-10-21.0.
  google.protobuf.Timestamp fetched_at = 23;
  // POI-IMAGES (additive): best licensed photo of the place; absent when none was found.
  PlaceImage hero_image = 24;
}
// A licensed photo stored by Wolfari; `sha256` names it, variants are 320/640/1280 px wide WebP.
message PlaceImage {
  string sha256 = 1;
  int32 width = 2; // 1280 variant
  int32 height = 3;
  string author = 4;
  string license = 5; // CC0-1.0 | PD | CC-BY-x.y | CC-BY-SA-x.y
  string license_url = 6;
  string source_url = 7; // File page on Wikimedia Commons
  string attribution = 8; // Line to show next to the photo
  string source = 9; // manual | wikidata | wikipedia | commons_category | commons_geo | osm_tag
}
message GetPoiImageRequest {
  string sha256 = 1;
  int32 width = 2; // 320 | 640 | 1280
}
message GetPoiImageResponse {
  bytes content = 1;
  string mime_type = 2; // image/webp
  int32 size_bytes = 3;
}
// Map frame for POI exploration, WGS84 degrees.
message BoundingBox {
  double min_longitude = 1;
  double min_latitude = 2;
  double max_longitude = 3;
  double max_latitude = 4;
}
message SearchPlacesRequest {
  string query = 1;
  wolfari.common.v1.Coordinate coordinates = 2;
  optional double radius_m = 3;
  string actor_user_id = 4;
  string trip_id = 5;
  string category = 6;
  bool geocode = 7;
  BoundingBox bbox = 8; // POI-OVERTURE: when set, radius_m and query are ignored.
  optional int32 limit = 9;
}
message SearchPlacesResponse {
  repeated Place data = 1;
  ProviderMetadata meta = 2;
}
message GetRouteRequest {
  repeated wolfari.common.v1.Coordinate coordinates = 1;
  RouteMode mode = 2;
  google.protobuf.Timestamp departure_at = 3;
}
message Route {
  double distance_m = 1;
  double duration_seconds = 2;
  repeated wolfari.common.v1.Coordinate geometry = 3;
}
message GetRouteResponse {
  Route data = 1;
  ProviderMetadata meta = 2;
}
message GetWeatherRequest {
  wolfari.common.v1.Coordinate coordinate = 1;
  string date = 2;
}
message Weather {
  google.protobuf.Timestamp forecast_at = 1;
  double temperature_c = 2;
  double rain_probability = 3;
  optional double uv_index = 4;
  optional double temperature_min_c = 5; // Lowest of the day; temperature_c is the highest.
}
message GetWeatherResponse {
  Weather data = 1;
  ProviderMetadata meta = 2;
}
message RecommendationScope {
  optional string date = 1;
  repeated string selected_location_ids = 2;
  repeated string activity_ids = 3;
}
message GetRecommendationRequest {
  wolfari.trip.v1.PlanSnapshot plan = 1;
  string type = 2;
  RecommendationScope scope = 3;
}
message ProposalItem {
  string id = 1;
  oneof values {
    wolfari.trip.v1.Activity activity = 2;
    wolfari.trip.v1.DressCode dress_code = 3;
    wolfari.trip.v1.PackingItem packing_item = 4;
  }
  string reason = 5;
  repeated string rule_ids = 6;
  repeated string warnings = 7; // e.g. ALREADY_IN_PLAN: shown, never applied silently.
}
message GetRecommendationResponse {
  repeated ProposalItem proposal = 1;
  string rule_version = 2;
  string input_hash = 3;
  repeated string warnings = 4;
  repeated ProviderMetadata provider_sources = 5;
}
