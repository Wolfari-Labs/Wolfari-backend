- tapOn: "Dán nội dung QR"
- tapOn: "000201..."
- setClipboard: "00020101021238570010A00000072701270006970403011300110123456780208QRIBFTTA530370454061800005802VN62340107NPS68690819thanh toan don hang63042E2E"
- pasteText
- hideKeyboard
- tapOn: "Đọc thông tin QR"
- assertVisible: "Kiểm tra thông tin chuyển khoản"
- scrollUntilVisible:
    element: '180\.000 ₫'
    direction: DOWN
- assertVisible: "180\\.000 ₫"
